name: Выпуск RPM

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить зависимости тестов и сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            createrepo-c \
            gir1.2-gtk-3.0 \
            poppler-utils \
            python3-gi \
            python3-pil \
            rpm \
            xvfb

      - name: Проверить версию тега
        shell: bash
        run: |
          set -Eeuo pipefail
          source_version="$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' naps3.py | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$source_version" || "$source_version" != "$tag_version" ]]; then
            echo "Версия приложения $source_version не совпадает с тегом $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Выполнить тесты
        run: |
          /usr/bin/python3 -m py_compile naps3.py
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
          xvfb-run -a env PYTHONPATH=. /usr/bin/python3 tests/gtk_smoke.py

      - name: Собрать RPM
        run: ./build_rpm.sh

      - name: Подготовить выпуск и DNF-репозиторий
        id: package
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm_path="$(find dist -maxdepth 1 -type f -name 'naps3-*.x86_64.rpm' ! -name '*latest*' | head -n 1)"
          if [[ -z "$rpm_path" ]]; then
            echo "RPM не найден" >&2
            exit 1
          fi

          stable_path="dist/naps3-latest.x86_64.rpm"
          cp "$rpm_path" "$stable_path"
          sha256sum "$rpm_path" "$stable_path" > dist/SHA256SUMS

          mkdir -p public/repo
          cp "$rpm_path" public/repo/
          createrepo_c public/repo

          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          owner_lower="${owner,,}"
          base_url="https://${owner_lower}.github.io/${repository}"

          cat > public/naps3.repo <<EOF
          [naps3]
          name=NAPS3 for RED OS 8
          baseurl=${base_url}/repo/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          EOF

          cat > public/index.html <<EOF
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><title>NAPS3 для РЕД ОС</title></head>
          <body><h1>NAPS3 для РЕД ОС</h1>
          <p>DNF-репозиторий версии ${GITHUB_REF_NAME#v}.</p>
          <pre>sudo curl -fsSL ${base_url}/naps3.repo -o /etc/yum.repos.d/naps3.repo &amp;&amp; sudo dnf install -y naps3</pre>
          <p><a href="https://github.com/${GITHUB_REPOSITORY}/releases/latest">Скачать выпуск</a></p>
          </body></html>
          EOF

          echo "rpm_path=$rpm_path" >> "$GITHUB_OUTPUT"
          echo "stable_path=$stable_path" >> "$GITHUB_OUTPUT"

      - name: Создать выпуск GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RPM_PATH: ${{ steps.package.outputs.rpm_path }}
          STABLE_PATH: ${{ steps.package.outputs.stable_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > release-notes.md <<'EOF'
          Версия 0.7 для РЕД ОС 8 x86_64.

          - Восстановление соединения остаётся привязано к выбранному МФУ.
          - Изменение страниц блокируется во время сохранения.
          - Экспорт использует временные файлы, проверку и откат.
          - При закрытии предлагается сохранить несохранённый документ.

          `naps3-latest.x86_64.rpm` — постоянная ссылка для установки одной командой.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "$RPM_PATH" \
            "$STABLE_PATH" \
            "dist/SHA256SUMS" \
            --title "NAPS3 ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md

      - name: Загрузить сайт репозитория
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Опубликовать DNF-репозиторий
        id: deployment
        uses: actions/deploy-pages@v4

