name: Выпуск NAPS3

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Установить зависимости тестов и сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            poppler-utils \
            python3-gi \
            python3-pil \
            rpm \
            xvfb

      - name: Проверить версию тега
        shell: bash
        run: |
          set -Eeuo pipefail
          source_version="$(sed -nE 's/^APP_VERSION = "([^"]+)"/\1/p' naps3.py | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$source_version" || "$source_version" != "$tag_version" ]]; then
            echo "Версия приложения $source_version не совпадает с тегом $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Выполнить тесты Linux
        run: |
          /usr/bin/python3 -m py_compile naps3.py windows_backend.py
          /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py'
          xvfb-run -a env PYTHONPATH=. /usr/bin/python3 tests/gtk_smoke.py

      - name: Собрать RPM
        run: ./build_rpm.sh

      - name: Подготовить RPM
        shell: bash
        run: |
          set -Eeuo pipefail
          rpm_path="$(find dist -maxdepth 1 -type f -name 'naps3-*.x86_64.rpm' ! -name '*latest*' | head -n 1)"
          [[ -n "$rpm_path" ]] || { echo "RPM не найден" >&2; exit 1; }
          cp "$rpm_path" dist/naps3-latest.x86_64.rpm
          (
            cd dist
            sha256sum "$(basename "$rpm_path")" naps3-latest.x86_64.rpm > SHA256SUMS.linux
          )

      - name: Загрузить RPM для выпуска
        uses: actions/upload-artifact@v6
        with:
          name: naps3-linux
          path: |
            dist/naps3-*.red80.x86_64.rpm
            dist/naps3-latest.x86_64.rpm
            dist/SHA256SUMS.linux
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Проверить версию тега
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath naps3.py -Raw
          $version = [regex]::Match($source, '(?m)^APP_VERSION = "([^"]+)"').Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if (-not $version -or $version -ne $tagVersion) {
            throw "Версия приложения $version не совпадает с тегом $env:GITHUB_REF_NAME"
          }

      - name: Установить Python, GTK и Poppler
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk3
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-pyinstaller

      - name: Выполнить тесты Windows
        shell: msys2 {0}
        run: |
          python -m py_compile naps3.py windows_backend.py windows/build_wia_bridge.py windows/startup_hook.py
          python -m unittest discover -v -s tests -p 'test_*.py'

      - name: Собрать и проверить нативный WIA-мост
        shell: msys2 {0}
        run: |
          python windows/build_wia_bridge.py
          ./build/windows-wia/NAPS3.WiaBridge.exe -Action selftest

      - name: Собрать переносимую программу
        shell: msys2 {0}
        run: ./windows/build_windows.sh

      - name: Проверить собранную программу
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\windows\NAPS3\NAPS3.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Self-test NAPS3 завершился с кодом $($process.ExitCode)"
          }
          $startupLog = Join-Path $env:LOCALAPPDATA "NAPS3\startup.log"
          if (-not (Test-Path -LiteralPath $startupLog -PathType Leaf)) {
            throw "Собранная программа не создала журнал запуска: $startupLog"
          }
          if (-not (Select-String -LiteralPath $startupLog -SimpleMatch "NAPS3 start" -Quiet)) {
            throw "В журнале запуска отсутствует отметка NAPS3 start"
          }

      - name: Собрать установщик и ZIP
        shell: pwsh
        run: .\windows\build_installer.ps1

      - name: Подготовить постоянную ссылку Windows
        shell: pwsh
        run: |
          $release = Resolve-Path .\dist\windows\release
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item -LiteralPath "$release\NAPS3-$version-Windows-x64.exe" -Destination "$release\NAPS3-latest-Windows-x64.exe"
          $files = Get-ChildItem -LiteralPath $release -File | Where-Object Name -Match '\.(exe|zip)$'
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          [IO.File]::WriteAllLines("$release\SHA256SUMS.windows", $lines, [Text.UTF8Encoding]::new($false))

      - name: Загрузить Windows-пакет для выпуска
        uses: actions/upload-artifact@v6
        with:
          name: naps3-windows
          path: |
            dist/windows/release/*.exe
            dist/windows/release/*.zip
            dist/windows/release/SHA256SUMS.windows
          if-no-files-found: error

  publish:
    needs:
      - linux
      - windows
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Скачать собранные пакеты
        uses: actions/download-artifact@v6
        with:
          pattern: naps3-*
          path: release-assets
          merge-multiple: true

      - name: Создать выпуск GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > release-notes.md <<'EOF'
          Версия 0.9.2 для РЕД ОС 8 x86_64 и Windows 10/11 x64.

          - Windows больше не выполняет PowerShell-скрипты при запуске и сканировании.
          - WIA вызывается через поставляемый нативный NAPS3.WiaBridge.exe.
          - Запрет PowerShell политикой организации не блокирует открытие программы.
          - Ранние ошибки сохраняются в `%LOCALAPPDATA%\NAPS3\startup.log` и показываются пользователю.

          - Windows теперь автоматически ищет сетевые eSCL-сканеры через DNS-SD/mDNS.
          - Найденные адреса проверяются по ScannerCapabilities перед показом в списке.
          - Диалог подключения показывает результат поиска и сохраняет ручной ввод IP.

          - Добавлен официальный CLI регистрации выбранного сканера для Printer Doctor.
          - USB проверяется по точному SANE ID, сеть — по IP или eSCL URL.
          - Профиль сохраняется атомарно с резервной копией без потери остальных настроек.
          - Открытый NAPS3 блокирует внешнее изменение профиля.
          - Регистрация пользовательского профиля от root запрещена.
          - Сохранены исправления Canon, защиты страниц и повтор занятого SANE-устройства.

          `NAPS3-latest-Windows-x64.exe` — постоянная ссылка на установщик Windows.
          `naps3-latest.x86_64.rpm` — постоянная ссылка для установки в РЕД ОС.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "NAPS3 ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md

      - name: Запустить публикацию DNF-репозитория
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=publish-pages
