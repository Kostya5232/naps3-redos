name: DNF-репозиторий

on:
  repository_dispatch:
    types:
      - publish-pages
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v5

      - name: Установить генератор метаданных DNF
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c rpm

      - name: Скачать RPM всех выпусков
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public/repo

          while IFS= read -r tag; do
            if ! gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'naps3-*.red80.x86_64.rpm' \
              --dir public/repo; then
              echo "В выпуске $tag нет RPM для РЕД ОС, пропускаем"
            fi
          done < <(
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 100 \
              --json tagName \
              --jq '.[].tagName'
          )

          latest_tag="$(
            gh release view \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName \
              --jq '.tagName'
          )"
          latest_version="${latest_tag#v}"
          latest_rpm="$(
            find public/repo -maxdepth 1 -type f \
              -name "naps3-${latest_version}-*.red80.x86_64.rpm" \
              -print -quit
          )"
          if [[ -z "$latest_rpm" ]]; then
            echo "RPM последнего выпуска не найден" >&2
            exit 1
          fi
          echo "LATEST_RPM=$latest_rpm" >> "$GITHUB_ENV"

      - name: Сохранить предыдущие метаданные DNF
        shell: bash
        env:
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p previous-repodata

          previous_run_id="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow pages.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty' || true
          )"
          if [[ -n "$previous_run_id" ]] && \
            gh run download "$previous_run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --name github-pages \
              --dir previous-pages; then
            mkdir -p previous-site
            tar -xf previous-pages/artifact.tar -C previous-site
            if [[ -d previous-site/repo/repodata ]]; then
              find previous-site/repo/repodata -maxdepth 1 -type f \
                ! -name repomd.xml \
                -exec cp '{}' previous-repodata/ \;
              find previous-repodata -maxdepth 1 -type f \
                -printf '%f\n' > previous-repodata-files.txt
            fi
          fi

          if [[ -s previous-repodata-files.txt ]]; then
            echo "Предыдущие метаданные взяты из публикации $previous_run_id"
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          export REPOSITORY_URL="https://${owner,,}.github.io/${repository}/repo"

          python3 - <<'PY'
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          repository_url = os.environ["REPOSITORY_URL"].rstrip("/")
          cache_buster = os.environ["CACHE_BUSTER"]
          destination = pathlib.Path("previous-repodata")

          def read_url(url):
              separator = "&" if "?" in url else "?"
              request = urllib.request.Request(
                  f"{url}{separator}run={urllib.parse.quote(cache_buster)}",
                  headers={"Cache-Control": "no-cache"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          try:
              repomd = read_url(f"{repository_url}/repodata/repomd.xml")
              root = ET.fromstring(repomd)
              files = []
              for location in root.findall(".//{*}location"):
                  href = location.get("href", "")
                  if not href.startswith("repodata/"):
                      continue
                  filename = pathlib.PurePosixPath(href).name
                  (destination / filename).write_bytes(
                      read_url(f"{repository_url}/{href}")
                  )
                  files.append(filename)
              pathlib.Path("previous-repodata-files.txt").write_text(
                  "".join(f"{name}\n" for name in files), encoding="utf-8"
              )
              print(f"Сохранено предыдущих файлов метаданных: {len(files)}")
          except Exception as error:
              print(f"Предыдущие метаданные недоступны, продолжаем: {error}")
          PY

      - name: Создать DNF-репозиторий и страницу установки
        shell: bash
        run: |
          set -Eeuo pipefail
          createrepo_c public/repo

          if [[ -d previous-repodata ]]; then
            find previous-repodata -maxdepth 1 -type f \
              -exec cp --no-clobber '{}' public/repo/repodata/ \;
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          owner_lower="${owner,,}"
          base_url="https://${owner_lower}.github.io/${repository}"
          version="$(rpm -qp --queryformat '%{VERSION}' "$LATEST_RPM")"

          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          repodata = pathlib.Path("public/repo/repodata")
          root = ET.parse(repodata / "repomd.xml").getroot()
          for location in root.findall(".//{*}location"):
              href = location.get("href", "")
              path = pathlib.Path("public/repo") / href
              if not path.is_file():
                  raise SystemExit(f"Новый индекс ссылается на отсутствующий файл: {href}")

          manifest = pathlib.Path("previous-repodata-files.txt")
          if manifest.is_file():
              for filename in manifest.read_text(encoding="utf-8").splitlines():
                  if not (repodata / filename).is_file():
                      raise SystemExit(
                          f"Предыдущий файл метаданных не сохранён: {filename}"
                      )
          PY

          cat > public/naps3.repo <<EOF
          [naps3-redos]
          name=NAPS3 for RED OS 8
          baseurl=${base_url}/repo/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=1m
          http_caching=packages
          skip_if_unavailable=0
          EOF

          cat > public/index.html <<EOF
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><title>NAPS3 для РЕД ОС</title></head>
          <body><h1>NAPS3 для РЕД ОС</h1>
          <p>DNF-репозиторий версии ${version}.</p>
          <pre>sudo curl -fsSL ${base_url}/naps3.repo -o /etc/yum.repos.d/naps3.repo &amp;&amp; sudo dnf --refresh install -y naps3</pre>
          <p><a href="https://github.com/${GITHUB_REPOSITORY}/releases/latest">Скачать выпуск</a></p>
          </body></html>
          EOF

      - name: Загрузить сайт репозитория
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Опубликовать DNF-репозиторий
        id: deployment
        uses: actions/deploy-pages@v5
