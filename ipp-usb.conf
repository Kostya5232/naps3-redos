[network]
  http-min-port = 60000
  http-max-port = 65535
  # NAPS3 uses an explicit loopback URL. DNS-SD only caused retries every two
  # seconds on workstations where Avahi is intentionally disabled.
  dns-sd = disable
  interface = loopback
  ipv6 = enable

[auth uid]
  all = *

[logging]
  # Never trace every 4096-byte USB read in production. On large colour
  # duplex pages that trace competes with the scanner data stream.
  device-log = error
  main-log = error
  console-log = error
  max-file-size = 256K
  max-backup-files = 2
  console-color = disable
  get-all-printer-attrs = false
